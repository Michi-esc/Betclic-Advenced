<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </radialGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#e50914" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- Glowing outer ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#shieldBorder)" stroke-width="4" opacity="0.6"/>

  <!-- Shield Shape -->
  <path d="M 256 90 L 370 140 C 370 270 256 360 256 390 C 256 360 142 270 142 140 Z" 
        fill="url(#shieldFill)" stroke="url(#shieldBorder)" stroke-width="8" filter="url(#shadow)"/>

  <!-- Football icon inside -->
  <circle cx="256" cy="230" r="54" fill="#ffffff"/>
  <!-- Pentagons -->
  <polygon points="256,206 272,218 266,238 246,238 240,218" fill="#0b0e14"/>
  <path d="M 256 206 L 256 182 M 272 218 L 294 212 M 266 238 L 280 258 M 246 238 L 232 258 M 240 218 L 218 212" 
        stroke="#0b0e14" stroke-width="5" stroke-linecap="round"/>

  <!-- AI Badge -->
  <rect x="206" y="300" width="100" height="38" rx="10" fill="#e50914"/>
  <text x="256" y="326" fill="#ffffff" font-family="'Orbitron', sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">PRO AI</text>
</svg>
