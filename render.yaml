services:
  - type: web
    name: betclic-advenced
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
